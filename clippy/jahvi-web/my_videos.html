<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jahvi — My Jobs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="my_videos.css">
</head>
<body>
<div class="bg-grid"></div>
<div class="app-shell">
  <main class="main">
    <header class="topbar">
      <a class="topbar-logo jobs-brand" href="dashboard.html">
        <img src="clipForge.png" alt="" class="logo-img">
        <span class="topbar-logo-text">Jahvi</span>
      </a>
      <div class="greeting">
        <div class="greeting-eyebrow">Processing queue</div>
        <div class="greeting-name" id="userName">My jobs</div>
      </div>
      <div class="avatar" id="userAvatar" aria-label="Your account">--</div>
      <a class="jobs-nav" href="dashboard.html">Dashboard</a>
      <button type="button" class="logout topbar-logout">Log out</button>
    </header>

    <section class="jobs-page" aria-labelledby="jobsTitle">
      <div class="jobs-hero">
        <div class="jobs-hero-copy">
          <p class="jobs-kicker"><span class="jobs-live-dot"></span>Render activity</p>
          <h1 id="jobsTitle">Your edits,<br><em>in motion.</em></h1>
          <p>Track the queue, follow each render, and play finished videos here.</p>
        </div>
        <div class="jobs-waveform" id="jobsWaveform" aria-hidden="true"></div>
      </div>

      <div class="jobs-overview" aria-label="Job summary">
        <div class="jobs-stat"><span>All jobs</span><strong id="jobsTotal">—</strong></div>
        <div class="jobs-stat"><span>In progress</span><strong id="jobsActive">—</strong></div>
        <div class="jobs-stat"><span>Ready to play</span><strong id="jobsReady">—</strong></div>
      </div>

      <div class="jobs-toolbar">
        <p id="jobsStatus" class="jobs-status" role="status" aria-live="polite">Loading jobs…</p>
        <button type="button" class="jobs-refresh" id="refreshJobsBtn" aria-label="Refresh jobs" title="Refresh jobs">↻</button>
      </div>
      <div class="jobs-list" id="jobsList"></div>
    </section>
  </main>
</div>
<script type="module" src="auth_ui.js"></script>
<script type="module" src="my_videos.js"></script>
<script type="module" src="download_video.js"></script>
</body>
</html>
